[package]
name = "ncrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "NETCONF console client (Rust port of netconf-console.py)"
publish = false

[lib]
name = "ncrust"
path = "src/lib.rs"

[[bin]]
name = "netconf-console"
path = "src/main.rs"

[features]
default = ["russh"]
# SSH back ends (see plan/IMPLEMENTATION_PLAN.md, P3). Dependencies are added with the back ends.
russh = []
ssh-subprocess = []

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
roxmltree = "0.20"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
