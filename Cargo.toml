[package]
name = "ncrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "NETCONF console client (Rust port of netconf-console.py)"
license = "MPL-2.0"
publish = false

[lib]
name = "ncrust"
path = "src/lib.rs"

[[bin]]
name = "ncrust"
path = "src/main.rs"

[features]
default = ["russh"]
# SSH back ends (see plan/IMPLEMENTATION_PLAN.md, P3).
russh = ["dep:russh", "dep:tokio"]
ssh-subprocess = []
# Compatibility with Tail-f NSO and ConfD: NETCONF over their IPC port (`--proto tcp`), `-s noaaa`,
# the tail-f NETCONF extensions, and the defaults of `netconf-console.py` (port 2022, admin/admin).
# Off by default; a general purpose NETCONF client does not need any of it.
tailf-compat = []

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
roxmltree = "0.20"
russh = { version = "0.64", default-features = false, features = ["aws-lc-rs", "rsa"], optional = true }
rustix = { version = "1", default-features = false, features = ["std", "process"] }
signal-hook = "0.3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
