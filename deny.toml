[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing attack on the rsa crate, which russh uses for RSA user keys. Only signing with a user's own RSA key is affected, and an attacker would have to time many logins; no fixed version exists. See plan/reports/security.md." },
]

[licenses]
version = 2
# Extend deliberately (with a note in plan/DECISIONS.md) when a new dependency needs another licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
